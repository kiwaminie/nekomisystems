<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Miku Rig</title>
    <link rel="icon" href="mikurig/images/mikurigicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Concert+One&display=swap" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #111116;
        font-family: 'Concert One', sans-serif;
      }

      canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
      }

      #ui-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 10;
      }

      #reset-button {
        pointer-events: auto;
        position: absolute;
        top: 1rem;
        right: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(75, 43, 238, 0.85);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.15s ease, background 0.15s ease;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      #reset-button:hover {
        transform: scale(1.05);
        background: rgba(95, 63, 255, 0.95);
      }

      #reset-button:active {
        transform: scale(0.98);
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255, 255, 255, 0.8);
        font-size: 1.25rem;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      #loading.hidden {
        opacity: 0;
      }
    </style>

    <script type="module" src="/src/mikurig/js/main.js"></script>
  </head>

  <body>
    <div id="loading">Cargando modelo...</div>

    <div id="ui-overlay">
      <button id="reset-button" onclick="resetMikurig()">Reset</button>
    </div>
  </body>
</html>
